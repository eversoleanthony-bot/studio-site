  <style>
    :root { --bg: #F6F1E7; --ink: #221E19; --accent-md: #C9A48E; --accent-lt: #DDB9A6; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--ink);
      color: var(--bg);
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      padding: 48px 64px;
    }
    main { max-width: 760px; }
    .role { font-size: 12px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--accent-md); margin: 0 0 28px; }
    h1 { font-family: 'Newsreader', Georgia, serif; font-weight: 300; font-size: clamp(44px, 8vw, 84px); line-height: 1; letter-spacing: -0.02em; margin: 0 0 32px; }
    .note { font-family: 'Newsreader', Georgia, serif; font-style: italic; font-weight: 300; font-size: clamp(20px, 3vw, 28px); line-height: 1.5; color: rgba(246, 241, 231, .8); margin: 0 0 36px; }
    a { color: var(--accent-lt); font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid rgba(221, 185, 166, .45); padding-bottom: 3px; }
    a:hover { border-bottom-color: var(--accent-lt); }
    a:focus-visible { outline: 3px solid var(--accent-lt); outline-offset: 4px; }
    @media (max-width: 600px) { body { padding: 32px 24px; } }
  </style>
</head>
